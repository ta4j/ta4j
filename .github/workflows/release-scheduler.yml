name: AI Semantic Release Scheduler

on:
  schedule:
    - cron: "0 9 * * 1" # Every other Monday, anchored at 2026-06-29 by scheduler.py.
  workflow_dispatch:
    inputs:
      dryRun:
        description: Assess normally and dispatch preparation with dryRun=true
        required: false
        default: true
        type: boolean
      aiMode:
        description: Full assessment or deterministic checks only (no model charge)
        default: full
        type: choice
        options: [full, skip]
      evaluateLuna:
        description: Also evaluate Luna 6 Decisions for comparison (additional model charge)
        default: false
        type: boolean

concurrency:
  group: semantic-release-ai-${{ github.repository }}
  cancel-in-progress: false

# Model jobs never receive mutation permissions. Only the named handoff and
# notification jobs can write, and neither executes model-generated commands.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  eligibility:
    name: Release eligibility
    if: ${{ github.event_name != 'schedule' || vars.RELEASE_SCHEDULER_ENABLED == 'true' }}
    runs-on: ${{ fromJSON(vars.RELEASE_SCHEDULER_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Each output is consumed by a dependency or the final outcome. Repository
    # evidence remains in an artifact, never in outputs or the console.
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
      last_tag: ${{ steps.policy.outputs.last_tag }}
      pom_version: ${{ steps.policy.outputs.pom_version }}
      dry_run: ${{ steps.policy.outputs.dry_run }}
      due: ${{ steps.policy.outputs.due }}
    steps:
      - name: Checkout the scheduler candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Set up policy runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read exact-commit CI and release lifecycle state
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const scheduler = require('./scripts/release/scheduler.cjs');
            await scheduler.collect({ github, context, sourceSha: process.env.SOURCE_SHA, directory: 'release-evidence' });
      - name: Apply deterministic eligibility rules
        id: policy
        env:
          DRY_RUN_INPUT: ${{ inputs.dryRun }}
          AI_MODE: ${{ inputs.aiMode || 'full' }}
        run: python3 scripts/release/scheduler.py context
      - name: Preserve the eligibility decision for dependent jobs
        uses: actions/upload-artifact@v7
        with:
          name: release-eligibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/context.json
          if-no-files-found: error
          retention-days: 14

  context_preparation:
    name: Context preparation
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ${{ fromJSON(vars.RELEASE_SCHEDULER_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout the eligible commit and release history
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.eligibility.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Set up evidence runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve the eligibility record
        uses: actions/download-artifact@v8
        with:
          name: release-eligibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence
      - name: Select production evidence and record coverage
        env:
          LAST_TAG: ${{ needs.eligibility.outputs.last_tag }}
          POM_VERSION: ${{ needs.eligibility.outputs.pom_version }}
        run: |
          GITHUB_OUTPUT= bash scripts/release/release_helpers.sh build-dossier \
            --last-tag "$LAST_TAG" --current-version "$POM_VERSION" \
            --pom-base "${POM_VERSION%-SNAPSHOT}" --max-diff-chars 160000 \
            --output release-evidence/release-dossier.md \
            --audit-output release-evidence/release-audit.json
      - name: Bind evidence and policy to the exact candidate
        run: python3 scripts/release/scheduler.py freeze
      - name: Share only the frozen assessment inputs
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-evidence/context.json
            release-evidence/release-dossier.md
            release-evidence/release-assessment-manifest.json
          if-no-files-found: error
          retention-days: 14

  release_assessment:
    name: Release assessment
    needs: [eligibility, context_preparation]
    if: needs.eligibility.outputs.eligible == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-release-assessment.yml
    with:
      source_sha: ${{ needs.eligibility.outputs.source_sha }}
      evidence_artifact: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      runner_labels: ${{ vars.RELEASE_ASSESSMENT_RUNNER || vars.RELEASE_SCHEDULER_RUNNER || '["ubuntu-latest"]' }}
      codex_model: ${{ vars.RELEASE_ASSESSMENT_MODEL || 'gpt-6.1-sol' }}
      codex_user: ${{ vars.RELEASE_ASSESSMENT_USER || '' }}
      evaluate_luna: ${{ inputs.evaluateLuna || vars.RELEASE_LUNA_EVALUATION_ENABLED == 'true' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  release_policy:
    name: Release policy and version
    needs: [eligibility, context_preparation, release_assessment]
    if: ${{ always() && needs.context_preparation.result == 'success' }}
    runs-on: ${{ fromJSON(vars.RELEASE_SCHEDULER_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      recommendation: ${{ steps.plan.outputs.recommendation }}
    steps:
      - name: Checkout the assessed source for version validation
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.eligibility.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Set up policy runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve frozen policy and source identity
        uses: actions/download-artifact@v8
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence
      - name: Fail closed on assessment failure and plan a monotonic version
        id: plan
        env:
          RECOMMENDATION: ${{ needs.release_assessment.outputs.recommendation }}
          ASSESSOR_STATUS: ${{ needs.release_assessment.result }}
        run: python3 scripts/release/scheduler.py plan
      - name: Retain the validated handoff plan
        uses: actions/upload-artifact@v7
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/release-plan.json
          if-no-files-found: error
          retention-days: 14

  release_handoff:
    name: Release handoff
    needs: [eligibility, release_policy]
    if: needs.release_policy.outputs.should_release == 'true'
    runs-on: ${{ fromJSON(vars.RELEASE_SCHEDULER_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout the trusted handoff controller
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          show-progress: false
      - name: Recheck freshness and dispatch exact-source preparation
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.release_policy.outputs.version }}
          DRY_RUN: ${{ needs.eligibility.outputs.dry_run }}
        with:
          script: |
            const scheduler = require('./scripts/release/scheduler.cjs');
            const handoff = await scheduler.handoff({ github, context, sourceSha: process.env.SOURCE_SHA,
              version: process.env.RELEASE_VERSION, dryRun: process.env.DRY_RUN });
            core.info(`audit:release_handoff status=${handoff.status} source=${process.env.SOURCE_SHA} version=${process.env.RELEASE_VERSION} dry_run=${process.env.DRY_RUN}`);

  outcome:
    name: Decision path and outcome
    needs: [eligibility, context_preparation, release_assessment, release_policy, release_handoff]
    if: always()
    runs-on: ${{ fromJSON(vars.RELEASE_SCHEDULER_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout the outcome reporter
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          show-progress: false
      - name: Set up outcome runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve eligibility reasons when available
        if: needs.eligibility.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: release-eligibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence
      - name: Explain successful, failed and skipped stages once
        env:
          STAGE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/release/scheduler.py summarize
          cat release-evidence/scheduler-outcome.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the concise outcome and recovery guidance
        uses: actions/upload-artifact@v7
        with:
          name: release-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-evidence/scheduler-outcome.json
            release-evidence/scheduler-outcome.md
          if-no-files-found: error
          retention-days: 14

  notification:
    name: Release discussion update
    needs: [eligibility, outcome]
    if: ${{ always() && needs.outcome.result == 'success' && needs.eligibility.outputs.dry_run == 'false' && needs.eligibility.outputs.due == 'true' }}
    runs-on: ${{ fromJSON(vars.RELEASE_SCHEDULER_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Checkout the notification controller
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          show-progress: false
      - name: Retrieve the single outcome report
        uses: actions/download-artifact@v8
        with:
          name: release-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-outcome
      - name: Link the release decision path from its discussion
        uses: actions/github-script@v9
        env:
          DISCUSSION_NUMBER: ${{ vars.RELEASE_SCHEDULER_DISCUSSION_NUMBER }}
        with:
          script: |
            const fs = require('node:fs');
            const scheduler = require('./scripts/release/scheduler.cjs');
            await scheduler.notify({ github, context,
              body: fs.readFileSync('release-outcome/scheduler-outcome.md', 'utf8'),
              discussionNumber: process.env.DISCUSSION_NUMBER });
