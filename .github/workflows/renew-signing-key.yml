name: Renew Maven signing key

on:
  workflow_dispatch:
    inputs:
      fingerprint:
        description: "Approved OpenPGP primary fingerprint to renew for two years (not an SSH key)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-signing-key-renewal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renew:
    name: Renew existing OpenPGP identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Renew, prove signing, publish public key, and update encrypted secret
        env:
          SIGNING_FINGERPRINT: ${{ inputs.fingerprint }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.GH_TA4J_REPO_TOKEN }}
        run: bash scripts/release/renew_signing_key.sh
