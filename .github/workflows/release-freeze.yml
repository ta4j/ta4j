name: Release Merge Freeze

on:
  workflow_dispatch:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled, closed]
  workflow_run:
    workflows: [Run Verify]
    types: [completed]

concurrency:
  group: release-freeze-status-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_FREEZE_AUTHORS: ${{ vars.RELEASE_OWNER || 'TheCookieLab' }}

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write
  actions: write

jobs:
  enforce-release-freeze:
    name: Enforce release freeze on master merges
    runs-on: ubuntu-latest
    steps:
      # Privileged metadata-only controller: never checkout a PR head or use its artifacts.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile the required merge barrier and notices
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const freeze = require('./scripts/release/release_freeze.cjs');
            await freeze.synchronize({ github, context, core, withNotices: true });
